name: reels
on:
  push:
    branches: [main]
    paths: ["reels/specs/**"]
  workflow_dispatch:
    inputs:
      only_id:
        description: "이 릴스만 다시 만들기 (비우면 아직 안 만든 것 전부)"
        required: false
concurrency:
  group: reels
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 준비
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q pillow
      - name: 릴스 만들기 (Pixabay 무료 실사 영상)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ONLY_ID: ${{ inputs.only_id }}
        run: python publisher/make_reels.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "yeodigo-reels"
          git config user.email "actions@users.noreply.github.com"
          git add reels/out || true
          git diff --cached --quiet || (git commit -m "reels out" && git pull --rebase -q && git push)
